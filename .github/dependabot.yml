version: 2
updates:
  - package-ecosystem: "npm"
    directory: "branding/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      branding-security:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      docker-security:
        patterns:
          - "*"
