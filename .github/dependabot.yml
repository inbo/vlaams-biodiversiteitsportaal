version: 2
updates:
  - package-ecosystem: "npm"
    directory: "branding/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      branding-all:
        applies-to: version-updates
      branding-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "test/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      test-all:
        applies-to: version-updates
      test-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/docker/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        group-by: dependency-name
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        applies-to: version-updates
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
