version: 2
updates:
  - package-ecosystem: "npm"
    directory: "branding/"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Font Awesome 7 breaks the ALA services; stay on 6.x
      - dependency-name: "@fortawesome/fontawesome-free"
        update-types: ["version-update:semver-major"]
      # jQuery 4 breaks Bootstrap's JS ("requires jQuery version 1.9.1 or
      # higher, but lower than version 4"); blocked until Bootstrap supports it.
      # jquery-migrate 4.x and @types/jquery 4.x track jQuery 4, so stay on 3.x.
      - dependency-name: "jquery"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jquery-migrate"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jquery"
        update-types: ["version-update:semver-major"]
    groups:
      branding-all:
        applies-to: version-updates
      branding-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "test/"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      test-all:
        applies-to: version-updates
      test-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/docker/*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # namematching-service pins Lombok 1.18.10 and fails to compile on
      # JDK (Corretto) > 13; the maven builder must stay on JDK 11.
      - dependency-name: "maven"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        group-by: dependency-name
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        applies-to: version-updates
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Ignore everything under /scripts/: no version or security updates
  # (ignore applies to security updates too; limit 0 blocks version updates)
  - package-ecosystem: "uv"
    directories:
      - "/scripts/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "pip"
    directories:
      - "/scripts/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
