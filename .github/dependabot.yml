version: 2
updates:
  - package-ecosystem: "npm"
    directory: "branding/"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      branding-all:
        applies-to: version-updates
      branding-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "test/"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      test-all:
        applies-to: version-updates
      test-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/docker/*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        group-by: dependency-name
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        applies-to: version-updates
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Ignore everything under /scripts/: no version or security updates
  # (ignore applies to security updates too; limit 0 blocks version updates)
  - package-ecosystem: "uv"
    directories:
      - "/scripts/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "pip"
    directories:
      - "/scripts/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
