<!-- Bug modal section -->
<div class="modal fade" id="bug-modal" tabindex="-1" role="dialog" aria-labelledby="bug-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bug-modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h5 class="modal-title bug-modal-title" id="bug-modal-label" data-i18n="footer.bug-modal.title">
                    Problemen melden op het VBP</h5>
            </div>
            <div class="modal-body bug-modal-content">
{{> bug-modal-body }}
            </div>
        </div>
    </div>
</div>
