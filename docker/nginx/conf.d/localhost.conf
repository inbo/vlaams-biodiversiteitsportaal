server {
    listen 80;
    listen [::]:80;

    root /srv/branding.la-flanders.org/www/;
    index index.html;
    client_max_body_size 600m;

    include /etc/nginx/generated/resolver.conf;
    include /etc/nginx/conf.d/cors;
    include /etc/nginx/conf.d/userdetails-mock;

    # Upstreams are put in variables so nginx resolves them per request (see ../templates/resolver.conf.template):
    # nginx then still starts when a container (e.g. geoserver) is not running.

    location / {
        alias /srv/branding.la-flanders.org/www/;
    }

    location /alerts {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host localhost;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 10m;

        set $upstream http://alerts.vbp.internal:8080;
        proxy_pass $upstream;
    }

    location /apikey {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host localhost;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 10m;

        set $upstream http://apikey.vbp.internal:8080;
        proxy_pass $upstream;
    }

    location /bie-hub {
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host localhost;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 10m;

        set $upstream http://bie-hub.vbp.internal:8080;
        proxy_pass $upstream;
    }

    location /bie-index {
