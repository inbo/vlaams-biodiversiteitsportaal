common:
  protocol: http
  domain: localhost
  homepage: ${common.protocol}://${common.domain}
  # Header and footer: host.docker.internal resolves to the local nginx for both the services and the browser
  brandingBaseURL: http://host.docker.internal

logging:
  config: /config/common/logback-docker.xml

grails:
  cors:
    allowedOriginPatterns: [ "http://localhost" ]

# Need to use host.docker.internal because these urls are use both by the client browser, and the services themselves
# So it is important they resolve to the same thing
security:
  jwt:
    discoveryUri: http://host.docker.internal/mock-oauth2/.well-known/openid-configuration
  oidc:
    discoveryUri: http://host.docker.internal/mock-oauth2/.well-known/openid-configuration

# spatial-service sandbox: pipelines.jar (Spark 3.4) needs Java <= 17, while portal-full runs Tomcat on Java 21.
# /usr/lib/jvm/jre-17 exists in both portal-full and the standalone spatial-service image (Corretto 17).
pipelinesCmd: "/usr/lib/jvm/jre-17/bin/java -Dspark.local.dir=/data/spatial-data/sandbox/tmp -Djava.io.tmpdir=/data/spatial-data/sandbox/tmp -cp /opt/vbp/pipelines/pipelines.jar"
