---
### OIDC Credentials ###
security:
  jwt:
    clientId: images
  oidc:
    clientId: images
    secret: images-oidc-super-secret
  core:
    optionalFilterPattern: ["/", "/*"]
    uriExclusionFilterPattern: [
        "^/ws/.*",
        "^/image-service/ws/.*",
        ".*proxyImage.*",
        "^/store/.*",
        # Image bytes (served by the proxyImage* actions, but matched on URL, not action name)
        ".*/image/[^/]+/(original|thumbnail.*|large|tms/.*)",
      ]

  ip:
    whitelist: "10.30.0.0/20"
webservice:
  client-id: images
  client-secret: xxx

server:
  servlet:
    contextPath: /image-service
grails:
  serverURL: "${common.protocol}://${common.domain}/image-service"

imageservice:
  imagestore:
    root: "/data/image-service/store"
    inbox: "/data/image-service/incoming"
    staging: "/data/image-service/store/staging"
  batchUpload: "/data/image-service/upload"
  exportDir: "/data/image-service/exports"
  apache:
    root: "${grails.serverURL}${grails.contextPath}/store/"
    # space separated list
    multiple_roots: "${grails.serverURL}${grails.contextPath}/store/"
  thumbnail:
    size: 300

serverName: "${common.protocol}://${common.domain}/image-service"

skin:
  layout: "ala-main"

# image-service uses the ala-bootstrap5 plugin, so it needs the Bootstrap 5 build of the VBP header/footer.
# Depends on the branding bundle served under /bs5 of the portal root, which has to provide
# assets.mustache, head.mustache, banner.mustache and footer.mustache (+ the css/js they reference).
headerAndFooter:
  baseURL: "${common.brandingBaseURL}/bs5"
  version: 2
  # Fetch <baseURL>/<fragment>.mustache; bootstrap/jquery css+js are loaded through assets.mustache,
  # so the layout does not add its own <baseURL>/css|js/... links (plugin defaults, set explicitly).
  useMustache: true
  excludeBootstrapCss: true
  excludeAlaStylesCss: true
  excludeBootstrapJs: true
  excludeApplicationJs: true

facets:
  [
    "recognisedLicence",
    "dataResourceUid",
    "creator.keyword",
    "imageSize",
    "fileType",
    "format",
    "dateUploadedYearMonth",
  ]

management:
  health:
    elasticsearch:
      enabled: false
elasticsearch:
  indexName: "images"
  maxFacetSize: 10000
  maxOffset: 10000
  maxPageSize: 200
  defaultPageSize: 10
  batchIndexSize: 1000
  hosts:
    - host: "elasticsearch"
      scheme: "http"
      port: 9200

# The URLs to recognise as image service URL for the purposes of recognising incoming
# URLs for images (to avoid re-downloading the images)
imageServiceUrls: ["${common.protocol}://${common.domain}/image-service"]

# External links
collectory:
  baseURL: "${common.protocol}://${common.domain}/collectory"
biocache:
  baseURL: "${common.protocol}://${common.domain}/biocache-hub"
  service:
    # Only used in the browser (occurrence lookup on the image details page): must be the public biocache-service JSON API
    baseURL: "${common.protocol}://${common.domain}/biocache-service"
bie:
  baseURL: "${common.protocol}://${common.domain}/bie-hub"

userDetails:
  url: "${common.protocol}://${common.domain}/userdetails/"

dataSource:
  driverClassName: org.postgresql.Driver
  dialect: org.hibernate.spatial.dialect.postgis.PostgisPG9Dialect
  url: "jdbc:postgresql://postgis:5432/images"
  username: "images"
  password: "my-super-secret-password"
  pooled: true
  jmxExport: true
  properties:
    jmxEnabled: true
    initialSize: 5
    maxActive: 50
    minIdle: 5
    maxIdle: 25
    maxWait: 10000
    maxAge: 600000
    timeBetweenEvictionRunsMillis: 5000
    minEvictableIdleTimeMillis: 60000
    validationQuery: SELECT 1
    validationQueryTimeout: 3
    validationInterval: 15000
    testOnBorrow: true
    testWhileIdle: true
    testOnReturn: false
    jdbcInterceptors: ConnectionState
    defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED

background:
  tasks:
    threads: 2
